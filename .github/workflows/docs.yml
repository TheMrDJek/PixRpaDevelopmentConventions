name: docs

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Содержание и реестр правил актуальны
        run: python tools/build_docs.py --check
      - name: Ссылки и якоря
        run: python tools/check_links.py
